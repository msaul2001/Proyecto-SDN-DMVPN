! Copia sanitizada para documentacion. No aplicar sin reponer secretos.
! Las lineas de credenciales se sustituyeron por comentarios.
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
clock timezone CST -6 0
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!


!
!
!
!
no ip domain lookup
ip domain name sdn.lab
ip cef
ipv6 unicast-routing
ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
! CREDENCIAL OMITIDA: usuario local / secret
! CREDENCIAL OMITIDA: usuario local / secret
!
redundancy
!
!
!
!
crypto ikev2 proposal DMVPN-PROP
 encryption aes-cbc-256
 integrity sha256
 group 14
!
crypto ikev2 policy DMVPN-POL
 match fvrf any
 proposal DMVPN-PROP
!
crypto ikev2 keyring DMVPN-KR
 peer SPOKES
  address 0.0.0.0 0.0.0.0
! CREDENCIAL OMITIDA: pre-shared-key (restaurar desde Vault)
 !
!
!
crypto ikev2 profile DMVPN-IKEV2
 match identity remote address 0.0.0.0
 authentication remote pre-share
 authentication local pre-share
 keyring local DMVPN-KR
!
!
!
crypto ipsec transform-set DMVPN-TRANS esp-aes 256 esp-sha-hmac
 mode transport
!
crypto ipsec profile DMVPN-IPSEC
 set transform-set DMVPN-TRANS
 set ikev2-profile DMVPN-IKEV2
!
!
!
!
!
!
!
interface Loopback0
 description LOOPBACK_R1
 ip address 10.254.0.1 255.255.255.255
!
interface Tunnel0
 description DMVPN_HUB_PRIMARIO
 ip address 10.255.1.1 255.255.255.0
 no ip redirects
 ip nhrp network-id 101
 ip nhrp redirect
 ipv6 address FE80::101:1 link-local
 ipv6 address 2001:824:101::1/64
 ipv6 nhrp network-id 201
 ipv6 nhrp redirect
 tunnel source Ethernet0/0
 tunnel mode gre multipoint
 tunnel key 101
 tunnel protection ipsec profile DMVPN-IPSEC
!
interface Ethernet0/0
 description UNDERLAY_ISP_NET
 ip address 172.16.0.1 255.255.255.0
 duplex auto
!
interface Ethernet0/1
 no ip address
 shutdown
 duplex auto
!
interface Ethernet0/2
 no ip address
 shutdown
 duplex auto
!
interface Ethernet0/3
 no ip address
 shutdown
 duplex auto
!
router bgp 65000
 bgp router-id 10.254.0.1
 bgp log-neighbor-changes
 bgp listen range 10.255.1.0/24 peer-group SPOKES
 bgp listen limit 20
 neighbor SPOKES peer-group
 neighbor SPOKES remote-as 65000
 neighbor SPOKES timers 10 30
 neighbor 2001:824:101::3 remote-as 65000
 neighbor 2001:824:101::3 timers 10 30
 neighbor 2001:824:101::4 remote-as 65000
 neighbor 2001:824:101::4 timers 10 30
 neighbor 2001:824:101::5 remote-as 65000
 neighbor 2001:824:101::5 timers 10 30
 neighbor 2001:824:101::6 remote-as 65000
 neighbor 2001:824:101::6 timers 10 30
 !
 address-family ipv4
  neighbor SPOKES activate
  neighbor SPOKES route-reflector-client
  no neighbor 2001:824:101::3 activate
  no neighbor 2001:824:101::4 activate
  no neighbor 2001:824:101::5 activate
  no neighbor 2001:824:101::6 activate
 exit-address-family
 !
 address-family ipv6
  neighbor 2001:824:101::3 activate
  neighbor 2001:824:101::3 route-reflector-client
  neighbor 2001:824:101::4 activate
  neighbor 2001:824:101::4 route-reflector-client
  neighbor 2001:824:101::5 activate
  neighbor 2001:824:101::5 route-reflector-client
  neighbor 2001:824:101::6 activate
  neighbor 2001:824:101::6 route-reflector-client
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip ssh time-out 60
ip ssh version 2
!
ip access-list standard SNMP-ZABBIX
 permit 172.16.0.10
!
ipv6 ioam timestamp
!
snmp-server group ZABBIX-GROUP v3 priv read ZABBIX-VIEW access SNMP-ZABBIX
snmp-server view ZABBIX-VIEW iso included
snmp-server location Guatemala-HUB1
snmp-server contact Administracion-SDN
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 exec-timeout 15 0
 login local
 transport input ssh
!
!
end
