! Copia sanitizada para documentacion. No aplicar sin reponer secretos.
! Las lineas de credenciales se sustituyeron por comentarios.
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R4
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
clock timezone CST -6 0
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!


!
!
!
!
ip domain name sdn.lab
ip cef
ipv6 unicast-routing
ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
! CREDENCIAL OMITIDA: usuario local / secret
! CREDENCIAL OMITIDA: usuario local / secret
!
redundancy
!
!
!
!
crypto ikev2 proposal DMVPN-PROP
 encryption aes-cbc-256
 integrity sha256
 group 14
!
crypto ikev2 policy DMVPN-POL
 match fvrf any
 proposal DMVPN-PROP
!
crypto ikev2 keyring DMVPN-KR
 peer HUB1
  address 172.16.0.1
! CREDENCIAL OMITIDA: pre-shared-key (restaurar desde Vault)
 !
 peer HUB2
  address 172.16.0.2
! CREDENCIAL OMITIDA: pre-shared-key (restaurar desde Vault)
 !
 peer SPOKE-R3
  address 172.16.0.3
! CREDENCIAL OMITIDA: pre-shared-key (restaurar desde Vault)
 !
 peer SPOKE-R5
  address 172.16.0.5
! CREDENCIAL OMITIDA: pre-shared-key (restaurar desde Vault)
 !
 peer SPOKE-R6
  address 172.16.0.6
! CREDENCIAL OMITIDA: pre-shared-key (restaurar desde Vault)
 !
!
!
crypto ikev2 profile DMVPN-IKEV2
 match identity remote address 172.16.0.1 255.255.255.255
 match identity remote address 172.16.0.2 255.255.255.255
 match identity remote address 172.16.0.3 255.255.255.255
 match identity remote address 172.16.0.5 255.255.255.255
 match identity remote address 172.16.0.6 255.255.255.255
 authentication remote pre-share
 authentication local pre-share
 keyring local DMVPN-KR
!
!
!
crypto ipsec transform-set DMVPN-TRANS esp-aes 256 esp-sha-hmac
 mode transport
!
crypto ipsec profile DMVPN-IPSEC
 set transform-set DMVPN-TRANS
 set ikev2-profile DMVPN-IKEV2
!
!
!
!
!
!
!
interface Loopback0
 description LOOPBACK_R4
 ip address 10.254.0.4 255.255.255.255
!
interface Tunnel0
 description DMVPN_SPOKE_HUB1
 ip address 10.255.1.4 255.255.255.0
 no ip redirects
 ip nhrp map 10.255.1.1 172.16.0.1
 ip nhrp map multicast 172.16.0.1
 ip nhrp network-id 101
 ip nhrp nhs 10.255.1.1
 ipv6 address FE80::101:4 link-local
 ipv6 address 2001:824:101::4/64
 ipv6 nhrp map 2001:824:101::1/128 172.16.0.1
 ipv6 nhrp map multicast 172.16.0.1
 ipv6 nhrp network-id 201
 ipv6 nhrp nhs 2001:824:101::1
 tunnel source Ethernet0/0
 tunnel mode gre multipoint
 tunnel key 101
 tunnel protection ipsec profile DMVPN-IPSEC shared
!
interface Tunnel1
 description DMVPN_SPOKE_HUB2
 ip address 10.255.2.4 255.255.255.0
 no ip redirects
 ip nhrp map 10.255.2.2 172.16.0.2
 ip nhrp map multicast 172.16.0.2
 ip nhrp network-id 102
 ip nhrp nhs 10.255.2.2
 ipv6 address FE80::102:4 link-local
 ipv6 address 2001:824:102::4/64
 ipv6 nhrp map 2001:824:102::2/128 172.16.0.2
 ipv6 nhrp map multicast 172.16.0.2
 ipv6 nhrp network-id 202
 ipv6 nhrp nhs 2001:824:102::2
 tunnel source Ethernet0/0
 tunnel mode gre multipoint
 tunnel key 102
 tunnel protection ipsec profile DMVPN-IPSEC shared
!
interface Ethernet0/0
 description UNDERLAY_ISP_NET
 ip address 172.16.0.4 255.255.255.0
 duplex auto
!
interface Ethernet0/1
 description LAN_SUCHI
 ip address 10.28.0.1 255.255.255.0
 duplex auto
 ipv6 address 2001:824:4::1/64
!
interface Ethernet0/2
 no ip address
 shutdown
 duplex auto
!
interface Ethernet0/3
 no ip address
 shutdown
 duplex auto
!
router bgp 65000
 bgp router-id 10.254.0.4
 bgp log-neighbor-changes
 neighbor 10.255.1.1 remote-as 65000
 neighbor 10.255.1.1 update-source Tunnel0
 neighbor 10.255.1.1 timers 10 30
 neighbor 10.255.2.2 remote-as 65000
 neighbor 10.255.2.2 update-source Tunnel1
 neighbor 10.255.2.2 timers 10 30
 neighbor 2001:824:101::1 remote-as 65000
 neighbor 2001:824:101::1 timers 10 30
 neighbor 2001:824:102::2 remote-as 65000
 neighbor 2001:824:102::2 timers 10 30
 !
 address-family ipv4
  network 10.28.0.0 mask 255.255.255.0
  neighbor 10.255.1.1 activate
  neighbor 10.255.2.2 activate
  no neighbor 2001:824:101::1 activate
  no neighbor 2001:824:102::2 activate
 exit-address-family
 !
 address-family ipv6
  network 2001:824:4::/64
  neighbor 2001:824:101::1 activate
  neighbor 2001:824:102::2 activate
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip ssh time-out 60
ip ssh version 2
!
ip access-list standard SNMP-ZABBIX
 permit 172.16.0.10
!
ipv6 ioam timestamp
!
snmp-server group ZABBIX-GROUP v3 priv read ZABBIX-VIEW access SNMP-ZABBIX
snmp-server view ZABBIX-VIEW iso included
snmp-server location Suchitepequez
snmp-server contact Administracion-SDN
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 exec-timeout 15 0
 login local
 transport input ssh
!
!
end
